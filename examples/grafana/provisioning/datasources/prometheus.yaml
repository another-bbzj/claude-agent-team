# Example only. install.py does not copy this file, and this repository does not run Grafana.
# Point url at the Prometheus that scrapes the node_exporter textfile described in docs/INTEGRATIONS.md.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
