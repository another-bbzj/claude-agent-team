    .ink { fill: #131722; }
    .muted { fill: #465066; }
    .faint { fill: #858c9d; }
    .brand { fill: #2c3d9e; stroke: #2c3d9e; }
    .gold { fill: #9c7818; stroke: #9c7818; }
    .ok { fill: #2b8466; stroke: #2b8466; }
    .warn { fill: #b36f0b; stroke: #b36f0b; }
    .info { fill: #1c74a8; stroke: #1c74a8; }
    .banner { fill: #153d50; }
    .bannertext { fill: #ffffff; }
    .track { fill: #e7e9ed; }
    .gridline { stroke: rgba(22, 28, 48, .06); }
    text { font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #070a11; }
      .card { fill: #141926; stroke: #232a3a; }
      .inset { fill: #0e121c; stroke: #232a3a; }
      .ink { fill: #eceae3; }
      .muted { fill: #a6acba; }
      .faint { fill: #676f83; }
      .brand { fill: #7085f0; stroke: #7085f0; }
      .gold { fill: #d3b35c; stroke: #d3b35c; }
      .ok { fill: #62b596; stroke: #62b596; }
      .warn { fill: #e3a444; stroke: #e3a444; }
      .info { fill: #5fb1e3; stroke: #5fb1e3; }
      .banner { fill: #153d50; }
      .bannertext { fill: #ffffff; }
      .track { fill: #0e121c; }
      .gridline { stroke: rgba(236, 234, 227, .05); }
    }
  </style>
