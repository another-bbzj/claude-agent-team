<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img" aria-labelledby="demoTitle demoDesc">
  <title id="demoTitle">只读合成演示看板</title>
  <desc id="demoDesc">synthetic-example 会话。名字、状态、成本和工具标签来自 examples/board-demo.synthetic.json，经 tools/demo_board.py 读出。金额用看板 fmtCost，已完成用时用夹具时间戳上的 fmtDur。不是屏幕录像，也不是用量基准。</desc>
  <style>
    .bg { fill: #e7e9ed; }
    .card { fill: #ffffff; stroke: #d2d6de; }
